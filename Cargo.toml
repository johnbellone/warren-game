[workspace]
members = [
    "protocol",
    "server",
    "game",
    "client",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.24"
tungstenite = "0.24"
futures = "0.3"
warren-protocol = { path = "protocol" }
rand = "0.8"
log = "0.4"
simple_logger = "5.0"
bevy = "0.20"

[workspace.dependencies.wasm-bindgen]
version = "0.2"