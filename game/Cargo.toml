# game/Cargo.toml
#
# The `warren-game` crate contains the voxel data model and, in later phases,
# the Bevy rendering engine for the collaborative editor.

[package]
name = "warren-game"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "warren_game"
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true }
log = { workspace = true }
warren-protocol = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
