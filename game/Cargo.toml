# game/Cargo.toml
#
# The `warren-game` crate contains the voxel data model and, in later phases,
# the Bevy rendering engine for the collaborative editor.

[package]
name = "warren-game"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "warren_game"
crate-type = ["rlib"]

[[bin]]
name = "warren-game-app"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = ["bevy_gltf", "gltf_animation"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
warren-protocol = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
avian3d = "0.8"

[dev-dependencies]
tokio = { workspace = true }
