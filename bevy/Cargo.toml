[package]
name = "warren-game-bevy-integration"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.13"
serde = { version = "1.0", features = ["derive"] }

# For web support
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[lib]
crate-type = ["cdylib", "rlib"]